<title>Materia · Caja</title>
<style>
  #caja {
    --bg: #0b0d10; --bg2: #12151a; --ink: #f2eee6; --ink-dim: rgba(242, 238, 230, 0.62); --ink-faint: rgba(242, 238, 230, 0.35);
    --line: rgba(255, 255, 255, 0.09); --gold: #e8c872; --amber: #ffb45c;

    background: radial-gradient(1200px 700px at 70% -20%, rgba(232, 200, 114, 0.08), transparent 60%), radial-gradient(900px 600px at 20% 110%, rgba(120, 90, 60, 0.08), transparent 60%), var(--bg);

  #caja :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .dim { color: var(--ink-dim); }

  /* title in the empty top row */
  .title { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; white-space: nowrap; }
  .title .t1 { display: block; font-family: var(--display); font-weight: 500; font-size: 1.35rem; letter-spacing: 0.08em; color: var(--ink-dim); }
  .title .t2 { display: block; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-top: 2px; }

  /* corner placeholders (inert) */
  .corner { position: absolute; z-index: 30; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); opacity: 0.45; background: rgba(18, 21, 26, 0.35); border: 1px solid var(--line); backdrop-filter: blur(6px); transition: opacity 0.2s; cursor: default; }
  .corner:hover { opacity: 0.8; }
  .corner svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .lens-btn { top: var(--m); left: var(--m); }
  .cog-btn { bottom: var(--m); left: var(--m); }
  .lenses-btn { bottom: var(--m); right: var(--m); width: auto; padding: 0 14px 0 10px; grid-auto-flow: column; gap: 8px; border-radius: 999px; }
  .corner-label { font-size: 0.85rem; font-weight: 600; }

  /* hover label */
  .hover { position: absolute; z-index: 20; transform: translate(-50%, -100%); padding: 8px 12px 9px; border-radius: 12px; background: rgba(14, 16, 20, 0.88); border: 1px solid var(--line); backdrop-filter: blur(10px); pointer-events: none; white-space: nowrap; font-size: 0.88rem; line-height: 1.3; opacity: 0; transition: opacity 0.12s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); }
  .hover.show { opacity: 1; }
  .hover b { font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
  .hover .l2 { color: var(--ink-dim); font-size: 0.78rem; margin-top: 2px; }

  /* card */
  .card { position: absolute; z-index: 25; top: calc(var(--m) + var(--corner)); bottom: calc(var(--m) + var(--corner)); width: clamp(300px, 34vw, 560px); display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; background: rgba(13, 15, 19, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(20px) saturate(1.25); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06); transition: opacity 0.38s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.38s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .card.right { right: var(--m); left: auto; transform: translateX(48px); }
  .card.left { left: var(--m); right: auto; transform: translateX(-48px); }
  .card:not(.open) { opacity: 0; pointer-events: none; }
  .card.open { opacity: 1; transform: none; }
  .card.jump { transition: none; }
  .card.muted { pointer-events: none; }
  .hero { position: relative; flex: 0 0 44%; background: linear-gradient(160deg, #1a1d24, #0c0e12); overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(13, 15, 19, 0.95), rgba(13, 15, 19, 0.1) 45%, transparent); pointer-events: none; }
  .nophoto { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-faint); font-size: 0.9rem; letter-spacing: 0.04em; }
  .nophoto[hidden] { display: none; }
  .credit { position: absolute; right: 12px; bottom: 8px; z-index: 2; font-size: 0.68rem; color: var(--ink-faint); max-width: 85%; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-body { flex: 1; display: flex; flex-direction: column; padding: 14px 22px 20px; min-height: 0; }
  .card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .card .sym { font-family: var(--display); font-weight: 600; font-size: 2.4rem; line-height: 1; color: var(--fam, var(--gold)); text-shadow: 0 0 24px color-mix(in srgb, var(--fam, var(--gold)) 40%, transparent); }
  .card .z { color: var(--ink-dim); font-size: 0.92rem; letter-spacing: 0.04em; }
  .card .z b { color: var(--ink); font-weight: 600; }
  .card .name { font-family: var(--display); font-weight: 500; font-size: clamp(1.7rem, 2.6vw, 2.4rem); line-height: 1; margin: 10px 0 2px; letter-spacing: -0.015em; }
  .card .en { font-size: 0.92rem; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; margin: 16px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
  .facts div { min-width: 0; }
  .facts dt { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-faint); }
  .facts dd { margin: 2px 0 0; font-family: var(--display); font-weight: 500; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); font-size: 0.85rem; }
  .enter { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; letter-spacing: 0.02em; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); transition: transform 0.15s, box-shadow 0.15s; }
  .enter:hover { transform: translateY(-1px); box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.2); }
  .enter span { font-size: 0.85em; opacity: 0.6; }

  /* bloom and deck */
  #bloom { position: absolute; inset: -20%; z-index: 40; pointer-events: none; opacity: 0; transform: scale(0.6); will-change: opacity, transform; mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 50%, #fff8ea 0%, #ffe3b0 14%, #ffbd68 28%, rgba(255, 150, 60, 0.85) 46%, rgba(170, 80, 20, 0.45) 68%, rgba(60, 25, 5, 0) 100%); }
  #deck { position: absolute; inset: 0; z-index: 50; opacity: 0; pointer-events: none; overflow: hidden; color: var(--ink);

<script>
(function () {
  'use strict';
  if (!window.THREE || !window.MATERIA) return;

  // ───────────────────────── data & grid
  const M = window.MATERIA, EL = M.elements, FAM = M.FAMILY_COLOR;
  const Q = new URLSearchParams(location.search);
  const SIMPLE = Q.get('simple') === '1';
  const REDUCED = Q.get('motion') === '0' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const $ = (s) => document.querySelector(s);

  const PITCH = 1.14, GAP = 0.14, COLS = 18, ROWS = 10;
  const GW = COLS * PITCH - GAP, GH = ROWS * PITCH - GAP;
  const DEPTH = 0.75, OPEN = 0.88, GLASS_Z = -0.03;
  const NUC_CAP = 48, BEAD = 0.021, BEADS_PER_SHELL = 12;
  const FOV = 26;

  const cellX = (x) => -GW / 2 + (x - 1) * PITCH + 0.5;
  const cellY = (y) => GH / 2 - (y - 1) * PITCH - 0.5;
  const byCell = new Map();
  EL.forEach((e) => byCell.set(e.x + ',' + e.y, e));
  const indexOf = new Map();
  EL.forEach((e, i) => indexOf.set(e.z, i));
  const electronsOf = (e) => e.shells.reduce((a, b) => a + b, 0);
  const famColor = (e) => FAM[e.family] || FAM.unknown;
  const hash = (i, k) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
  const clamp01 = (u) => (u < 0 ? 0 : u > 1 ? 1 : u);
  const smooth = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };
  const lerp = (a, b, u) => a + (b - a) * u;
  const hermite = (p0, p1, m0, m1, u) => { const u2 = u * u, u3 = u2 * u; return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m1; };

  // ───────────────────────── renderer, scene, camera
  const canvas = $('#gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.02, 120);
  scene.add(camera);

  // Gallery environment: a dark room with a warm light strip overhead (gives glass its glint and the rims their sheen).
  function makeEnvironment() {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const g = c.getContext('2d');
    const v = g.createLinearGradient(0, 0, 0, 512);
    v.addColorStop(0, '#2a241d'); v.addColorStop(0.42, '#101214'); v.addColorStop(0.72, '#07080a'); v.addColorStop(1, '#030304');
    g.fillStyle = v; g.fillRect(0, 0, 1024, 512);
    const band = g.createLinearGradient(0, 118, 0, 212);
    band.addColorStop(0, 'rgba(255,230,190,0)'); band.addColorStop(0.5, 'rgba(255,236,205,0.8)'); band.addColorStop(1, 'rgba(255,230,190,0)');
    g.fillStyle = band; g.fillRect(0, 118, 1024, 94);
    for (let i = 0; i < 6; i++) {
      const x = 90 + i * 170;
      const r = g.createRadialGradient(x, 162, 0, x, 162, 72);
      r.addColorStop(0, 'rgba(255,249,235,1)'); r.addColorStop(0.3, 'rgba(255,236,200,0.75)'); r.addColorStop(1, 'rgba(255,220,170,0)');
      g.fillStyle = r; g.fillRect(x - 72, 90, 144, 144);
    }
    const cool = g.createRadialGradient(820, 300, 0, 820, 300, 260);
    cool.addColorStop(0, 'rgba(120,150,200,0.35)'); cool.addColorStop(1, 'rgba(120,150,200,0)');
    g.fillStyle = cool; g.fillRect(560, 40, 520, 520);
    const tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    const pm = new THREE.PMREMGenerator(renderer);
    const rt = pm.fromEquirectangular(tex);
    pm.dispose(); tex.dispose();
    return rt.texture;
  }
  scene.environment = makeEnvironment();

  const keyLight = new THREE.DirectionalLight(0xffd9a6, 3.2); keyLight.position.set(-3, 10, 6); scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0x8fa6c8, 0.35); fillLight.position.set(5, -3, 6); scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0x3a3128, 1.1));

  const N = EL.length;
  const dummy = new THREE.Object3D();
  const tmpC = new THREE.Color();
  const WHITE = new THREE.Color(1, 1, 1);

  // ───────────────────────── boxes: shell, rim, glass lid, floor tint, plates
  function openBoxGeometry() {
    const g = new THREE.BoxGeometry(1, 1, DEPTH);
    const idx = Array.from(g.index.array).filter((_, i) => i < 24 || i >= 30); // drop the +z (front) face
    g.setIndex(idx); g.clearGroups();
    g.translate(0, 0, -DEPTH / 2);
    return g;
  }
  function frameShape(outer, inner) {
    const s = new THREE.Shape();
    s.moveTo(-outer, -outer); s.lineTo(outer, -outer); s.lineTo(outer, outer); s.lineTo(-outer, outer); s.closePath();
    const h = new THREE.Path();
    h.moveTo(-inner, -inner); h.lineTo(-inner, inner); h.lineTo(inner, inner); h.lineTo(inner, -inner); h.closePath();
    s.holes.push(h);
    return s;
  }
  function radialTexture(size, inner, outer) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d');
    const r = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    r.addColorStop(0, inner); r.addColorStop(1, outer);
    g.fillStyle = r; g.fillRect(0, 0, size, size);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
  }

  const shellMat = new THREE.MeshStandardMaterial({ color: 0x26272c, roughness: 0.8, metalness: 0.1, side: THREE.DoubleSide, envMapIntensity: 0.9 });
  const shell = new THREE.InstancedMesh(openBoxGeometry(), shellMat, N);
  const rimGeo = new THREE.ExtrudeGeometry(frameShape(0.5 - 0.012, 0.44 + 0.012), { depth: 0.03, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1 });
  rimGeo.translate(0, 0, 0.006);
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x4a3f34, roughness: 0.45, metalness: 0.5, envMapIntensity: 1.1 });
  const rim = new THREE.InstancedMesh(rimGeo, rimMat, N);
  const glassGeo = new THREE.PlaneGeometry(OPEN, OPEN); glassGeo.translate(0, -OPEN / 2, 0); // hinge along the top edge
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x161a20, roughness: 0.06, metalness: 0, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 2.2, ior: 1.5, specularIntensity: 1 });
  const glass = new THREE.InstancedMesh(glassGeo, glassMat, N);

    selected = e; cursorEl = e; state = 'card';
    $('#cSym').textContent = e.symbol; $('#cZ').textContent = e.z; $('#cName').textContent = e.es; $('#cEn').textContent = e.en;
    $('#cMass').textContent = String(e.mass); $('#cEle').textContent = electronsOf(e); $('#cShells').textContent = e.shells.join(' · ');
    card.style.setProperty('--fam', famColor(e));
    setPhoto(heroImg, e, (missing) => { noPhoto.hidden = !missing; });
    credit.textContent = e.hero ? photoCredit(e) : '';
    card.setAttribute('aria-hidden', 'false');
    if (wasOpen && sideChanged) {
      card.classList.add('jump'); card.classList.remove('open', 'right', 'left'); card.classList.add(side);
      void card.offsetWidth; card.classList.remove('jump');
      requestAnimationFrame(() => card.classList.add('open'));
    } else { card.classList.remove('right', 'left'); card.classList.add(side, 'open'); }
  }
  function closeCard() {
    selected = null;
    if (state === 'card') state = 'table';
    card.classList.remove('open'); card.setAttribute('aria-hidden', 'true');
  }

  // deck
  function fillDeck(e) {
    $('#dSym').textContent = `${e.symbol} · Z ${e.z}`;
    $('#dName').textContent = e.es;
    $('#dSub').textContent = `${e.en} · masa ${e.mass} · ${electronsOf(e)} electrones en ${e.shells.length} capas`;
    setPhoto(deckPhoto, e, () => {});
    $('#dCredit').textContent = e.hero ? `Foto: ${photoCredit(e)}` : 'Sin fotografía en los datos';
  }

  // ───────────────────────── the dive
  const DV = { T: 3.4, A: 0.4, B: 0.61, C: 0.94, CREEP: 0.32, OPEN_ANGLE: -1.78, FOV_PUSH: 18 };
  const dive = { t: 0, dir: 0, el: null, i: -1 };
  function setDoor(i, angle, glint) {
    const e = EL[i];
    dummy.position.set(cellX(e.x), cellY(e.y) + OPEN / 2, GLASS_Z); dummy.rotation.set(angle, 0, 0); dummy.scale.setScalar(1); dummy.updateMatrix();
    glass.setMatrixAt(i, dummy.matrix); glass.instanceMatrix.needsUpdate = true;
    glass.setColorAt(i, tmpC.setScalar(glint)); glass.instanceColor.needsUpdate = true;
  }
  function applyDive(t) {
    const e = dive.el, i = dive.i, bx = cellX(e.x), by = cellY(e.y), zN = -DEPTH / 2;
    const aspect = innerWidth / innerHeight;
    const d1 = 1 / (1.2 * Math.tan((FOV * Math.PI) / 360) * Math.min(1, aspect)); // box spans 60% of the short side
    const TA = DV.A * DV.T, TB = (DV.B - DV.A) * DV.T, TC = (DV.C - DV.B) * DV.T;
    const d2 = d1 - DV.CREEP * TB, zEnd = zN + 0.03;
    let z;
    if (t < DV.A) z = hermite(fit.D, d1, 0, -DV.CREEP * TA, t / DV.A);
    else if (t < DV.B) z = d1 - DV.CREEP * TB * ((t - DV.A) / (DV.B - DV.A));
    else z = hermite(d2, zEnd, -DV.CREEP * TC, -(d2 - zEnd) * 2.2, clamp01((t - DV.B) / (DV.C - DV.B)));
    const ul = smooth(t / DV.A);
    camera.position.set(lerp(fit.cx, bx, ul), lerp(fit.cy, by, ul), z);
    camera.fov = FOV + DV.FOV_PUSH * smooth((t - DV.B) / (DV.C - DV.B)); camera.updateProjectionMatrix(); // the lens opens as we push in
    const ud = smooth((t - DV.A) / (DV.B - DV.A));
    setDoor(i, DV.OPEN_ANGLE * ud, 1 + 7 * Math.pow(Math.sin(Math.PI * ud), 4));
    card.style.opacity = String(1 - clamp01(t / 0.22));
    const b = smooth((t - 0.8) / 0.14);
    bloom.style.opacity = String(b); bloom.style.transform = `scale(${0.6 + 0.9 * b})`;
    deck.style.opacity = String(smooth((t - 0.93) / 0.07));
    setGlow(i, 1 + 5 * smooth((t - 0.72) / 0.22));
    const k = smooth(1 - (camera.position.z - zN) / 2.0); // the nucleus parts as the camera arrives
    placeNucleus(i, 1 + 2.4 * k, 0.16 * k);
    nuc.instanceMatrix.needsUpdate = true;
  }
  function startDive(e) {
    if (state === 'diving' || state === 'returning' || state === 'deck') return;
    if (!card.classList.contains('open') || selected !== e) showCard(e);
    fillDeck(e);
    hover.classList.remove('show'); litGlass(-1);
    if (REDUCED) {
      state = 'deck'; deck.classList.add('anim', 'live'); deck.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => { deck.style.opacity = '1'; });
      return;
    }
    dive.el = e; dive.i = indexOf.get(e.z); dive.t = 0; dive.dir = 1; dive.t0 = performance.now(); dive.tStart = 0; state = 'diving';
    card.classList.add('muted'); deck.classList.remove('anim');
    applyDive(0);
  }
  function volver() {
    if (state !== 'deck') return;
    deck.classList.remove('live'); deck.setAttribute('aria-hidden', 'true');
    if (REDUCED || !dive.el) {
      deck.style.opacity = '0'; state = 'card';
      return;
    }
    dive.dir = -1; dive.t = 1; dive.t0 = performance.now(); dive.tStart = 1; state = 'returning';
    applyDive(1);
  }
  function updateDive(dt) {
    // Wall-clock timeline: a throttled or stalled frame loop must not stretch the dive.
    dive.t = Math.max(0, Math.min(1, dive.tStart + (dive.dir * (performance.now() - dive.t0)) / 1000 / DV.T));
    if (dive.dir > 0 && dive.t >= 1) {
      dive.t = 1; applyDive(1); state = 'deck';
      bloom.style.opacity = '0'; deck.classList.add('live'); deck.setAttribute('aria-hidden', 'false');
      return;
    }
    if (dive.dir < 0 && dive.t <= 0) {
      dive.t = 0; applyDive(0); state = 'card';
      card.classList.remove('muted'); card.style.opacity = '';
      camera.position.set(fit.cx, fit.cy, fit.D);
      return;
    }
    applyDive(dive.t);
  }

  // ───────────────────────── input
  let down = null, lastClick = 0, lastClickEl = null;
  const interactive = () => state === 'table' || state === 'card';
  canvas.addEventListener('pointermove', (ev) => { if (!interactive()) return; setHover(pick(ev.clientX, ev.clientY)); });
  canvas.addEventListener('pointerleave', () => { if (hoverEl) { hoverEl = null; positionHover(); } });
  canvas.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
  canvas.addEventListener('pointerup', (ev) => {
    if (!down) return;
    const moved = Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6; down = null;
    if (moved || !interactive()) return;
    const e = pick(ev.clientX, ev.clientY);
    if (!e) { closeCard(); return; }
    const now = performance.now();
    if (e === lastClickEl && now - lastClick < 380) { lastClick = 0; startDive(e); return; }
    lastClick = now; lastClickEl = e;
    showCard(e);
  });
  $('#enter').addEventListener('click', () => { if (selected) startDive(selected); });
  $('#volver').addEventListener('click', volver);
  function neighbor(from, dx, dy) {
    let x = from.x, y = from.y;
    for (let k = 0; k < 20; k++) { x += dx; y += dy; if (x < 1 || x > COLS || y < 1 || y > ROWS) return null; const e = byCell.get(x + ',' + y); if (e) return e; }
    return null;
  }
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      if (state === 'deck') volver();
      else if (state === 'card') closeCard();
      else if (state === 'table') { cursorEl = null; hoverEl = null; positionHover(); }
      return;
    }
    if (!interactive()) return;
    if (ev.key === 'Enter') { const e = selected || cursorEl; if (e) { ev.preventDefault(); startDive(e); } return; }
    const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (!dir) return;
    ev.preventDefault();
    const from = cursorEl || selected || EL[0];
    const next = (cursorEl || selected) ? neighbor(from, dir[0], dir[1]) : from;
    if (!next) return;
    cursorEl = next; hoverEl = null; hoverText(next);
    if (state === 'card') showCard(next);
    positionHover();
  });
  addEventListener('resize', resize);

  // ───────────────────────── frame loop
  const perf = { sum: 0, max: 0, n: 0, last: performance.now() };
  function updateHighlights(t) {
    const hv = interactive() ? (hoverEl || cursorEl) : null;
    if (hv && hv !== selected) { hoverFrame.visible = true; hoverFrame.position.set(cellX(hv.x), cellY(hv.y), 0.055); } else hoverFrame.visible = false;
    litGlass(hv ? indexOf.get(hv.z) : -1);
    if (selected && state !== 'deck') {
      selFrame.visible = true; selFrame.position.set(cellX(selected.x), cellY(selected.y), 0.055);
      selFrame.material.color.set(famColor(selected));
      const fade = (state === 'diving' || state === 'returning') ? 1 - clamp01(dive.t / 0.3) : 1;
      selFrame.material.opacity = (0.55 + 0.25 * Math.sin(t * 2.6)) * fade;
    } else selFrame.visible = false;
  }
  let running = false, raf = 0, lastT = performance.now();
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    const t = now / 1000;
    uTime.value = t;
    if (state === 'diving' || state === 'returning') updateDive(dt);
    updateHighlights(t);
    if (state !== 'deck') {
      const t0 = performance.now();
      renderer.render(scene, camera);
      const ms = performance.now() - t0;
      perf.sum += ms; perf.n++; if (ms > perf.max) perf.max = ms;
      if (now - perf.last > 3000 && perf.n) {
        const r = renderer.info.render;
        console.info(`[caja] ${(perf.sum / perf.n).toFixed(2)} ms/frame avg · ${perf.max.toFixed(1)} ms max · ${r.calls} draw calls · ${r.triangles} tris · ${state}`);
        perf.sum = perf.max = perf.n = 0; perf.last = now;
      }
    }
    if (hoverEl || cursorEl) positionHover();
  }
  function start() { if (!running) { running = true; lastT = performance.now(); raf = requestAnimationFrame(frame); } }
  function stop() { running = false; cancelAnimationFrame(raf); }
  document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

  resize();
  start();
})();
</script>
